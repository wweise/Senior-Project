<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Film | Student Film Database</title>
    <link rel="stylesheet" href="addMovie.css">
</head>
<body>

    <!-- Back to Film Database Button -->
    <div class="back-link-container">
        <a href="index.html" class="back-btn">← Back to Film Database</a>
    </div>

   
    <div class="container">
        <div class="form-container">
            <h1>Add Film Project</h1>
            <form class="form">
                <label>Title:</label>
                <input type="text" placeholder="Enter Film Title" required>

                <label>Genre:</label>
                <input type="text" placeholder="Enter Genre" required>

                <label>Year:</label>
                <input type="text" placeholder="Enter Year">

                <label>Run Time:</label>
                <input type="text" placeholder="Enter Run Time in Minutes">

                <label>Director:</label>
                <input type="text" placeholder="Enter Director Name">

                <label>Producer:</label>
                <input type="text" placeholder="Enter Producer Name">

                <label>Screenwriter:</label>
                <input type="text" placeholder="Enter Screenwriter Name">

                <label>Cinematographer:</label>
                <input type="text" placeholder="Enter Cinematographer Name">

                <label>Editor:</label>
                <input type="text" placeholder="Enter Editor Name">

                <div class="button-container">
                    <button type="submit" class="submit-btn">Submit</button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
