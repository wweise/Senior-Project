<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Film | Student Film Database</title>

    <!-- Load your CSS -->
    <link rel="stylesheet" href="addMovie.css">

    <!-- Load Bootstrap (same as update page) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
          rel="stylesheet" 
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" 
          crossorigin="anonymous">
</head>

<body>

    <!-- Back to Film Database Button -->
    <div class="back-link-container">
        <a href="index.html" class="back-btn">&larr; Back to Film Database</a>
    </div>

    <div class="container">
        <div class="form-container">
            <h1>Add Film Project</h1>

            <form class="form">

                <label for="title">Title:</label>
                <input type="text" id="title" name="title" placeholder="Enter Film Title" required>

                <label for="genre">Genre:</label>
                <input type="text" id="genre" name="genre" placeholder="Enter Film Genre" required>

                <label for="year">Year:</label>
                <input type="text" id="year" name="year" placeholder="Enter Year" required>

                <label for="time">Run Time:</label>
                <input type="text" id="time" name="time" placeholder="Enter Run Time in Minutes" required>

                <label for="director">Director:</label>
                <input type="text" id="director" name="director" placeholder="Enter Director Name">

                <label for="producer">Producer:</label>
                <input type="text" id="producer" name="producer" placeholder="Enter Producer Name">

                <label for="screenwriter">Screenwriter:</label>
                <input type="text" id="screenwriter" name="screenwriter" placeholder="Enter Screenwriter Name">

                <label for="cinematographer">Cinematographer:</label>
                <input type="text" id="cinematographer" name="cinematographer" placeholder="Enter Cinematographer Name" required>

                <label for="editor">Editor:</label>
                <input type="text" id="editor" name="editor" placeholder="Enter Editor Name">

                <h2>Crew Members:</h2>
                <div id="crewContainer"></div>

                <button type="button" onclick="addCrewRow()">+ Add Crew Member</button>

                <div class="button-container">
                    <button type="submit" class="submit-btn">Submit</button>
                </div>

            </form>
        </div>
    </div>

    <script src="addMovie.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" 
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" 
            crossorigin="anonymous"></script>

</body>
</html>
