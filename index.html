<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Point Park Student Film Database</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header class="site-header">
        <h1 class="title">Student Film Database</h1>
        <p class="subtitle">Point Park University</p>
    </header>

    <main>

        <!-- Search Section -->
        <section id="search" class="search-section">
            <div class="search-container">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Search by title, director, genre, or year..."
                    aria-label="Search Films"
                >
                <button id="searchBtn">Search</button>
            </div>
        </section>

        <!-- Movies Display Section -->
        <section id="movies" class="movies-section">
            <div id="resultsContainer" class="results-grid">
                <p class="placeholder-text">Search for a film to get started.</p>
            </div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
