<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Point Park Student Film Database</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header class="site-header">
        <div class="header-content">
            <h1>Student Film Database</h1>
            <p class="subtitle">Point Park University</p>
        </div>
    </header>

    <main>

        <!-- Search Section -->
        <section id="search" class="search-section">
            <div class="search-box">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Search by title, director, genre..."
                    aria-label="Search Films"
                >
                <button id="searchBtn">Search</button>
            </div>
        </section>

        <!-- Movies Display Section -->
        <section id="movies" class="movies-section">
            <div class="movies-placeholder">
                <p>
                    🎬 Student films will appear here once the database and API are connected.
                </p>
            </div>
        </section>

    </main>

    <footer class="site-footer">
        <p>© 2026 Point Park University — Student Film Archive</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
