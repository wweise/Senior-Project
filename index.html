<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Point Park Student Film Database</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header class="site-header">
        <h1>Student Film Database</h1>
        <p class="subtitle">Point Park University</p>
    </header>

    <!-- Search Section -->
    <section id="search" class="search-section">
        <input 
            type="text" 
            id="searchInput" 
            placeholder="Search films by title, director, or genre..."
            aria-label="Search Films"
        >
        <button id="searchBtn">Search</button>
    </section>

    <!-- Movies Display Section -->
    <section id="movies" class="movies-section">
        <p class="placeholder">
            Student films will appear here once the database and API are connected.
        </p>
    </section>

    <script src="script.js"></script>
</body>
</html>
