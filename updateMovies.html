<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./stylesheets/updateMovies.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Update Film Project</title>
</head>
<body>

    <!-- Back to Film Database Button -->
    <div class="back-link-container">
        <a href="index.html" class="back-btn">&larr; Back to Film Database</a>
    </div>

    <div class="container">
        <div class="form-container">
            <h2>Update Film Project</h2>

            <form class="form">

                <label for="filmId">Film ID:</label>
                <input type="number" id="filmId" placeholder="Enter Film ID" required>

                <label for="title">Title:</label>
                <input type="text" id="title" placeholder="Enter Film Title" required>

                <label for="genre">Genre:</label>
                <input type="text" id="genre" placeholder="Enter Film Genre" required>

                <label for="year">Year:</label>
                <input type="text" id="year" placeholder="Enter Year" required>

                <label for="runTime">Run Time:</label>
                <input type="text" id="runTime" placeholder="Enter Run Time in Minutes" required>

                <div class="button-container">
                    <button type="submit" class="submit-btn">Submit</button>
                </div>

            </form>
        </div>
    </div>

    <!-- REQUIRED: Load your update JS -->
    <script src="updateMovies.js"></script>

</body>
</html>
